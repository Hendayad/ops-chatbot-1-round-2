<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learner Chat Viewer</title>
  <style>
    :root {
      color-scheme: light;
    }

    .viz-root {
      color-scheme: light;
      --page-plane: #f9f9f7;
      --surface-1: #fcfcfb;
      --surface-2: #f2f2ef;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --muted: #898781;
      --gridline: #e1e0d9;
      --border: rgba(11, 11, 11, 0.10);

      --series-1: #2a78d6;
      /* blue — assistant / nudge bubble */
      --series-2: #008300;
      /* green — used sparingly */
      --status-good: #0ca30c;
      --status-warning: #fab219;
      --status-critical: #d03b3b;
    }

    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .viz-root {
        color-scheme: dark;
        --page-plane: #0d0d0d;
        --surface-1: #1a1a19;
        --surface-2: #232322;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --muted: #898781;
        --gridline: #2c2c2a;
        --border: rgba(255, 255, 255, 0.10);
        --series-1: #3987e5;
        --series-2: #008300;
      }
    }

    :root[data-theme="dark"] .viz-root {
      color-scheme: dark;
      --page-plane: #0d0d0d;
      --surface-1: #1a1a19;
      --surface-2: #232322;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --gridline: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --series-1: #3987e5;
      --series-2: #008300;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .viz-root {
      display: block;
      min-height: 100vh;
      padding: 24px;
      background: var(--page-plane);
      color: var(--text-primary);
    }

    h1,
    h2,
    h3 {
      font-weight: 600;
      margin: 0;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .top-bar h1 {
      font-size: 20px;
    }

    .top-bar .sub {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 2px;
    }

    .top-bar a {
      color: var(--series-1);
      font-size: 13px;
    }

    .panel {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .conn-panel {
      margin-bottom: 18px;
    }

    .conn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .field input,
    .field select {
      font: inherit;
      font-size: 13px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--page-plane);
      color: var(--text-primary);
      min-width: 220px;
    }

    .field.checkbox-field {
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    .field.checkbox-field label {
      font-size: 13px;
      color: var(--text-primary);
    }

    button {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--series-1);
      color: #fff;
      cursor: pointer;
    }

    button.secondary {
      background: transparent;
      color: var(--text-primary);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .status-line {
      font-size: 13px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.ok {
      background: var(--status-good);
    }

    .dot.err {
      background: var(--status-critical);
    }

    .dot.idle {
      background: var(--muted);
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 14px;
      align-items: start;
    }

    @media (max-width: 780px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .session-list {
      padding: 10px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .session-list h2 {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 6px 8px 10px;
    }

    .session-item {
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 2px;
    }

    .session-item:hover {
      background: var(--surface-2);
    }

    .session-item.active {
      background: var(--series-1);
      color: #fff;
    }

    .session-item .s-name {
      font-weight: 600;
    }

    .session-item .s-id {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .session-item.active .s-id {
      color: rgba(255, 255, 255, 0.75);
    }

    .transcript-panel {
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 70vh;
    }

    .transcript-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--gridline);
      gap: 10px;
      flex-wrap: wrap;
    }

    .transcript-head h2 {
      font-size: 14px;
    }

    .transcript-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble-row {
      display: flex;
    }

    .bubble-row.user {
      justify-content: flex-end;
    }

    .bubble-row.assistant,
    .bubble-row.system {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble-row.user .bubble {
      background: var(--series-1);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .bubble-row.assistant .bubble {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 3px;
    }

    .bubble-row.system .bubble {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-secondary);
      font-style: italic;
    }

    .bubble-meta {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 3px;
      text-align: right;
    }

    .bubble-row.assistant .bubble-meta {
      text-align: left;
    }

    .bubble-row.nudge .bubble {
      background: var(--surface-2);
      border: 1.5px solid var(--status-warning);
      position: relative;
    }

    .nudge-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10.5px;
      font-weight: 700;
      color: #7a5200;
      background: var(--status-warning);
      padding: 2px 7px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .empty-state,
    .error-state,
    .loading-state {
      padding: 40px 10px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      margin: auto;
    }

    .error-state {
      color: var(--status-critical);
    }
  </style>
</head>

<body>
  <div class="viz-root">

    <div class="top-bar">
      <div>
        <h1>Learner Chat Viewer</h1>
        <div class="sub">Chat history for the signed-in account, including any at-risk nudge appended by
          <code>LearnerChatChannel</code>.</div>
      </div>
    </div>

    <div class="panel conn-panel">
      <input type="hidden" id="api-base" value="__API_BASE__">
      <input type="hidden" id="api-token" value="__API_TOKEN__">
      <div class="status-line" id="conn-status"><span class="dot idle"></span><span>Loading…</span></div>
    </div>

    <div class="layout">
      <div class="panel session-list">
        <h2>Sessions</h2>
        <div id="session-list-body">
          <div class="empty-state">Sign in to see this account's chat sessions.</div>
        </div>
      </div>

      <div class="panel transcript-panel">
        <div class="transcript-head">
          <h2 id="transcript-title">No session selected</h2>
          <button class="secondary" id="refresh-btn" disabled>Refresh</button>
        </div>
        <div class="transcript-body" id="transcript-body">
          <div class="empty-state">Pick a session on the left once you're signed in.</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    (function () {
      "use strict";

      var LS_TOKEN_KEY = "chat_viewer_user_token";
      var LS_BASE_KEY = "chat_viewer_api_base";
      var LS_REMEMBER_KEY = "chat_viewer_remember";

      // Heuristic only -- the /chatbot/messages API returns plain {role, content}
      // (app/schemas/chat.py's Message has no metadata field), so the
      // nudge_type/dedup_key LearnerChatChannel attaches via additional_kwargs
      // doesn't survive the round trip. Flagging by matching known nudge body
      // text is good enough for a demo viewer; it is not a substitute for the
      // dedup_key-based checks the real notification system uses.
      var NUDGE_PHRASES = ["noticed things might be", "checking in", "just checking in"];

      var el = {
        apiBase: document.getElementById("api-base"),
        connStatus: document.getElementById("conn-status"),
        sessionListBody: document.getElementById("session-list-body"),
        transcriptTitle: document.getElementById("transcript-title"),
        transcriptBody: document.getElementById("transcript-body"),
        refreshBtn: document.getElementById("refresh-btn")
      };

      var state = {
        userToken: document.getElementById("api-token").value.trim(),
        sessions: [],
        activeSessionId: null,
        activeSessionToken: null
      };

      function setConnStatus(kind, text) {
        el.connStatus.innerHTML = '<span class="dot ' + kind + '"></span><span></span>';
        el.connStatus.querySelector("span:last-child").textContent = text;
      }

      function apiBase() {
        return el.apiBase.value.trim().replace(/\/+$/, "");
      }

      function escapeHtml(s) {
        var div = document.createElement("div");
        div.textContent = s == null ? "" : String(s);
        return div.innerHTML;
      }

      function looksLikeNudge(message) {
        if (message.role !== "assistant") return false;
        var lower = (message.content || "").toLowerCase();
        return NUDGE_PHRASES.some(function (phrase) { return lower.indexOf(phrase) !== -1; });
      }


      async function fetchSessions(userToken) {
        var resp = await fetch(apiBase() + "/api/v1/auth/sessions", {
          headers: { Authorization: "Bearer " + userToken }
        });
        if (!resp.ok) {
          if (resp.status === 401) throw { message: "Session expired — please sign in again." };
          throw { message: "Failed to load sessions (HTTP " + resp.status + ")." };
        }
        return resp.json();
      }

      async function fetchMessages(sessionToken) {
        var resp = await fetch(apiBase() + "/api/v1/chatbot/messages", {
          headers: { Authorization: "Bearer " + sessionToken }
        });
        if (!resp.ok) {
          if (resp.status === 401) throw { message: "Session token expired — pick the session again." };
          throw { message: "Failed to load messages (HTTP " + resp.status + ")." };
        }
        return resp.json();
      }

      /* ---------------- rendering ---------------- */

      function renderSessionList() {
        if (!state.sessions.length) {
          el.sessionListBody.innerHTML = '<div class="empty-state">This account has no chat sessions yet.</div>';
          return;
        }
        var html = state.sessions.map(function (s) {
          var active = s.session_id === state.activeSessionId ? " active" : "";
          var name = s.name && s.name.trim() ? escapeHtml(s.name) : "Untitled session";
          return (
            '<div class="session-item' + active + '" data-session-id="' + escapeHtml(s.session_id) + '">' +
            '<span class="s-name">' + name + '</span>' +
            '<span class="s-id">' + escapeHtml(s.session_id) + '</span>' +
            '</div>'
          );
        }).join("");
        el.sessionListBody.innerHTML = html;
        Array.prototype.forEach.call(el.sessionListBody.querySelectorAll(".session-item"), function (row) {
          row.addEventListener("click", function () { selectSession(row.getAttribute("data-session-id")); });
        });
      }

      function renderMessages(messages) {
        if (!messages.length) {
          el.transcriptBody.innerHTML = '<div class="empty-state">No messages in this session yet.</div>';
          return;
        }
        var html = messages.map(function (m) {
          var isNudge = looksLikeNudge(m);
          var rowClass = "bubble-row " + m.role + (isNudge ? " nudge" : "");
          var badge = isNudge ? '<div class="nudge-badge">⚑ likely at-risk nudge</div>' : "";
          return (
            '<div class="' + rowClass + '">' +
            '<div>' +
            badge +
            '<div class="bubble">' + escapeHtml(m.content) + '</div>' +
            '<div class="bubble-meta">' + escapeHtml(m.role) + '</div>' +
            '</div>' +
            '</div>'
          );
        }).join("");
        el.transcriptBody.innerHTML = html;
        el.transcriptBody.scrollTop = el.transcriptBody.scrollHeight;
      }

      /* ---------------- actions ---------------- */

      async function selectSession(sessionId) {
        var session = state.sessions.find(function (s) { return s.session_id === sessionId; });
        if (!session) return;
        state.activeSessionId = sessionId;
        state.activeSessionToken = session.token.access_token;
        el.transcriptTitle.textContent = (session.name && session.name.trim()) ? session.name : sessionId;
        el.refreshBtn.disabled = false;
        renderSessionList();
        await loadMessages();
      }

      async function loadMessages() {
        if (!state.activeSessionToken) return;
        el.transcriptBody.innerHTML = '<div class="loading-state">Loading messages…</div>';
        try {
          var data = await fetchMessages(state.activeSessionToken);
          renderMessages(data.messages || []);
        } catch (err) {
          el.transcriptBody.innerHTML = '<div class="error-state">' + escapeHtml(err.message || "Failed to load messages.") + '</div>';
        }
      }

      async function loadSessions() {
        el.sessionListBody.innerHTML = '<div class="loading-state">Loading sessions…</div>';
        try {
          state.sessions = await fetchSessions(state.userToken);
          renderSessionList();
          if (state.sessions.length) {
            await selectSession(state.sessions[0].session_id);
          } else {
            el.transcriptBody.innerHTML = '<div class="empty-state">This account has no chat sessions yet.</div>';
          }
        } catch (err) {
          el.sessionListBody.innerHTML = '<div class="error-state">' + escapeHtml(err.message || "Failed to load sessions.") + '</div>';
        }
      }

      el.refreshBtn.addEventListener("click", loadMessages);

      (function init() {
        if (state.userToken) {
          setConnStatus("ok", "Connected.");
          loadSessions();
        } else {
          setConnStatus("err", "No session token available.");
          el.sessionListBody.innerHTML = '<div class="error-state">No session token available.</div>';
        }
      })();

    })();
  </script>
</body>

</html>
